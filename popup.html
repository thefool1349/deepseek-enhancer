<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div
            style="
                display: flex;
                align-items: center;
                justify-content: space-between;
            "
        >
            <h3 style="margin-top: 0; margin-bottom: 0">DeepSeek Enhancer</h3>

            <a
                href="https://github.com/thefool1349/deepseek-enhancer"
                target="_blank"
                class="doc-link"
                >doc</a
            >
        </div>
        <hr style="margin-top: 12px" />

        <div class="settings-container">
            <div class="setting-row">
                <span>Hide DeepSeek Thought</span>
                <label class="toggle-switch">
                    <input type="checkbox" id="hide-thought-toggle" />
                    <span class="slider"></span>
                </label>
            </div>

            <hr class="divider" />

            <div class="setting-row">
                <span>Custom Instructions</span>
                <button id="btn-toggle-instruction" class="btn-add">
                    + Add Instruction
                </button>
            </div>

            <div
                id="instruction-input-container"
                style="
                    margin-top: 10px;
                    display: none;
                    flex-direction: column;
                    gap: 8px;
                "
            >
                <input
                    type="text"
                    class="instruction-input"
                    id="instruction-title"
                    placeholder="Title (e.g. Code Reviewer)"
                />

                <textarea
                    class="instruction-input"
                    id="instruction-body"
                    placeholder="Instruction text..."
                    rows="3"
                    style="resize: vertical; font-family: inherit"
                ></textarea>

                <button id="btn-save-instruction" class="btn-save-form">
                    Save Instruction
                </button>
            </div>

            <ul class="instruction-list" id="instruction-list"></ul>
        </div>

        <div id="custom-modal" class="modal-overlay" style="display: none">
            <div class="modal-box">
                <p id="modal-message">Are you sure?</p>
                <div class="modal-buttons">
                    <button id="btn-modal-cancel" class="btn-modal-cancel">
                        Cancel
                    </button>
                    <button id="btn-modal-ok" class="btn-modal-ok">OK</button>
                </div>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
